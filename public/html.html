<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket Chat App</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      h2 {
        font-weight: 100;
      }
      nav {
        text-align: center;
        background-color: blueviolet;
        padding: 10px;
        color: white;
      }
      .container {
        max-width: 1000px;
        margin: 100px auto 50px;
        padding: 20px;
        display: flex;
      }
      .sidebar {
        width: 150px;
        margin-right: 20px;
      }
      .chat-container {
        flex: 1;
      }
      .chatbox {
        height: 500px;
        list-style: none;
        display: flex;
        flex-flow: column;
        background: #eee;
        border-radius: 6px;
        box-shadow: 1px 0px 10px #eee;
      }
      #messagelist {
        flex: 1;
        overflow-y: scroll;
      }
      #messagelist .private {
        background: #015e4b;
        color: #fff;
        margin-left: auto;
      }
      #messagelist li {
        list-style: none;
        background: white;
        max-width: 400px;
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        position: relative;
      }
      #messagelist li.right {
        background: #d1f7c4;
        align-self: flex-end;
      }
      #messagelist li.left {
        background: #f1f1f1;
        align-self: flex-start;
      }
      #messagelist li.pinned {
        border: 2px solid gold;
      }
      form.Input {
        display: flex;
      }
      form.Input input {
        flex: 10;
        padding: 14px 10px;
        border: none;
      }
      form.Input button {
        padding: 4px;
        background: teal;
        border: none;
        flex: 1;
        color: white;
        cursor: pointer;
      }
      #users {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        height: 100px;
        overflow-y: scroll;
        flex-flow: row;
        padding-top: 20px;
      }
      #users li {
        min-width: 100px;
        max-height: 20px;
        border-radius: 10px;
        background: white;
        text-align: center;
        box-shadow: 0px 2px 10px #eee;
      }
      .sidebar ul {
        list-style: none;
        padding: 0;
      }
      .sidebar li {
        padding: 10px;
        background-color: #eee;
        margin-bottom: 5px;
        cursor: pointer;
      }
      .sidebar li.active {
        background-color: blueviolet;
        color: white;
      }
      .pin-checkbox {
        position: absolute;
        top: 5px;
        right: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Socket Chat App</h1>
    <div class="container">
      <div class="sidebar">
        <h2>Select Class</h2>
        <ul id="classList">
          <li data-class="1">Class 1</li>
          <li data-class="2">Class 2</li>
        </ul>
      </div>
      <div class="chat-container">
        <div class="chatbox">
          <ul id="messagelist"></ul>
          <form class="Input">
            <input type="text" placeholder="Type your message ..." />
            <button type="submit">Send</button>
          </form>
        </div>
        <br />
        <div class="activeusers">
          <h2>Active Users</h2>
          <ul id="users"></ul>
        </div>
      </div>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const messageForm = document.querySelector(".chatbox form");
      const messageList = document.querySelector("#messagelist");
      const classList = document.querySelector("#classList");
      const socket = io("http://localhost:3000");

      let currentClassId = "";
      let userId = localStorage.getItem("userId") || 6; // Replace with actual userId retrieval logic

      socket.on("connect", () => {
        console.log("connected", socket.id);
      });

      socket.on("receive_class_message", (data) => {
        console.log(data);
        addMessageToUI(data, data.userId === parseInt(userId));
      });

      socket.on("message_updated", (data) => {
        console.log(data, "message updated");
        updateMessageInUI(data);
      });

      classList.addEventListener("click", (e) => {
        if (e.target.tagName === "LI") {
          const classId = e.target.getAttribute("data-class");
          if (classId && classId !== currentClassId) {
            if (currentClassId) {
              socket.emit("leave_room", parseInt(currentClassId, 10));
            }
            socket.emit("join_room", parseInt(classId, 10));
            currentClassId = classId;

            document.querySelector(".sidebar li.active")?.classList.remove("active");
            e.target.classList.add("active");
          }
        }
      });

      messageForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = e.target.querySelector("input").value;
        if (message && currentClassId) {
          socket.emit("send_class_message", {
            classId: parseInt(currentClassId, 10),
            userId: parseInt(userId),
            message: message,
          });
          e.target.querySelector("input").value = "";
        }
      });

      function addMessageToUI(data, isCurrentUser) {
        const li = document.createElement("li");
        li.textContent = data.message || "Image/Video/Document";
        li.classList.add(isCurrentUser ? "right" : "left");
        li.classList.toggle("pinned", data.isPinned);
        li.setAttribute("data-message-id", data.id);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = data.isPinned;
        checkbox.classList.add("pin-checkbox");
        checkbox.addEventListener("change", () => {
          const isPinned = checkbox.checked;
          socket.emit("update_message", {
            classId: parseInt(currentClassId, 10),
            messageId: data.id,
            isPinned: isPinned,
          });
        });

        li.appendChild(checkbox);
        messageList.appendChild(li);
        messageList.scrollTop = messageList.scrollHeight;
      }

      function updateMessageInUI(data) {
        const messageElement = document.querySelector(`[data-message-id="${data.messageId}"]`);
        if (messageElement) {
          messageElement.classList.toggle("pinned", data.isPinned);
          const checkbox = messageElement.querySelector(".pin-checkbox");
          if (checkbox) {
            checkbox.checked = data.isPinned;
          }
        }
      }
    </script>
  </body>
</html>
