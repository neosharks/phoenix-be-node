<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600&display=swap');

      body {
        font-family: 'Public Sans', 'Helvetica', 'Arial', sans-serif;
        background-color: #f8f8f8;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        margin-top: 20px;
      }

      .logo {
        text-align: center;
        margin-bottom: 20px;
      }

      .logo img {
        max-width: 200px;
      }

      h2 {
        font-size: 24px;
        color: #333;
        text-align: center;
        margin-bottom: 20px;
      }

      p {
        margin: 15px 0;
        font-size: 16px;
        line-height: 1.6;
        color: #555;
      }

      .otp-container {
        background-color: #e4f1fe;
        padding: 10px;
        border-radius: 6px;
        display: inline-block;
        margin: 20px 0;
      }

      .otp {
        font-size: 30px;
        font-weight: bold;
        color: #007bff;
      }

      .footer {
        background: rgb(118, 53, 220);
        margin-top: 30px;
        padding: 10px;
        border-top: 1px solid #eee;
        font-size: 14px;
        color: #888;
        text-align: center;
      }

      .footer p {
        margin: 5px 0;
        color: black;
      }

      .footer a {
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">
        <img
          src="https://qalakar-public.s3.ap-south-1.amazonaws.com/email-assets/logo.png"
          alt="Qalakar Logo"
        />
      </div>

      <h2>Forgot Password</h2>
      <p>
        Hello,
      </p>
      <p>
        You are receiving this email because we received a password reset request for your account.
      </p>
      <p>
        Please enter the following code:
        <div class="otp-container">
          <span class="otp">{{code}}</span>
        </div>
      </p>

      <div class="footer">
        <p>You can contact us at</p>
        <p>
          Mail: <a href="mailto:contact@qalakar.com">contact@qalakar.com</a><br />
          Phone: <a href="tel:+8174901463">8174901463</a>
        </p>
      </div>
    </div>
  </body>
</html>
