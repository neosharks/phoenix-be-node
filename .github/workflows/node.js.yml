# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'

    - name: Verify Node.js version
      run: node -v

    - name: Check EC2 Instance Status
      run: |
        instance_id="YOUR_INSTANCE_ID"
        instance_status=$(aws ec2 describe-instance-status --instance-ids $instance_id --query 'InstanceStatuses[0].InstanceState.Name' --output text)
        if [ "$instance_status" != "running" ]; then
          echo "Instance is not running. Exiting..."
          exit 1
        fi

    - run: yarn
    - run: |
        mkdir -p ./dist
        touch .env
        echo "${{ secrets.PROD_ENV_FILE }}" > .env
        cp .env ./dist/.env
    - run: yarn build
    - run: pm2 restart Backend

