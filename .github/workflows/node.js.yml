name: Node.js CI

on:
  push:
    branches: [ "dev" ]
    
jobs:
  build:
  
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]


    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: |
        touch .env
        echo "${{ secrets.PROD_ENV_FILE }}" > .env
    - run: npm run build --if-present
    - run: pm2 restart Backend
  
