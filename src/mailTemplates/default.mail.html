<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fallback mail</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f8f8f8;
        margin: 0;
        padding: 0;
      }

      .container {
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        margin-top: 20px;
      }

      img {
        max-width: 250px;
        margin-bottom: 20px;
      }

      h2 {
        margin-top: 20px;
        font-size: 28px;
        color: #333;
      }

      p {
        margin: 15px 0;
        font-size: 18px;
        line-height: 1.6;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="text-align: center">
        <img
          src="https://qalakar-public.s3.ap-south-1.amazonaws.com/email-assets/logo.png"
          alt="Qalakar Logo"
          width="200"
        />
      </div>
      <h3>Fallback Mail</h3>
    </div>
  </body>
</html>
