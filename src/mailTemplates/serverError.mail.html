<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fallback mail</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f8f8f8;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff;
        border: 1px solid #ddd;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }

      .header,
      .footer {
        background: rgb(174, 107, 237);
        color: white;
        padding: 15px 0;
        text-align: center;
        border-radius: 10px 10px 0 0;
      }

      .footer {
        border-radius: 0 0 10px 10px;
        margin-top: 20px;
      }

      .footer p {
        color: black;
      }

      img {
        max-width: 150px;
        margin: 20px 0;
        border-radius: 8px;
      }

      h2 {
        font-size: 1.5rem;
        color: #333;
        margin: 20px 0;
      }

      p {
        font-size: 1rem;
        font-family: __Public_Sans_d7c01c, __Public_Sans_Fallback_d7c01c, Helvetica, Arial,
          sans-serif;
        font-weight: 400;
        line-height: 1.8;
        color: #555;
        margin: 15px 0;
      }

      .divider {
        height: 1px;
        background-color: #ddd;
        margin: 20px 0;
      }

      @media (max-width: 600px) {
        .container {
          padding: 10px;
        }

        img {
          max-width: 150px;
        }

        h2 {
          font-size: 1.5rem;
        }

        p {
          font-size: 0.875rem;
          font-family: __Public_Sans_d7c01c, __Public_Sans_Fallback_d7c01c, Helvetica, Arial,
            sans-serif;
          font-weight: 400;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Server Error!</h1>
      </div>

      <img
        src="https://qalakar-public.s3.ap-south-1.amazonaws.com/email-assets/logo.png"
        alt="Qalakar Logo"
      />

      <h2>Hi,</h2>
      <h1>500 SERVER ERROR</h1>

      <p>Best Regards,</p>
      <p>The Qalakar Team</p>

      <div class="footer">
        <p>© 2024 Qalakar. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
